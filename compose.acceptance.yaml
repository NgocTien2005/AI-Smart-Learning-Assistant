# Isolated acceptance only. Invoke with a unique lumina-acceptance-* project.
# Supply fresh test-only secrets through the launching process environment.
services:
  db:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lumina_acceptance
      POSTGRES_USER: lumina_acceptance
      POSTGRES_PASSWORD: ${ACCEPTANCE_DB_PASSWORD:?Supply a fresh test-only password}
    labels:
      io.lumina.acceptance: "true"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina_acceptance -d lumina_acceptance"]
      interval: 3s
      timeout: 5s
      retries: 30
  backend:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build: ./backend
    environment:
      NODE_ENV: production
      LUMINA_DEMO_ALLOWED: "true"
      PORT: 3000
      DATABASE_URL: postgresql://lumina_acceptance:${ACCEPTANCE_DB_PASSWORD}@db:5432/lumina_acceptance?schema=public
      JWT_SECRET: ${ACCEPTANCE_JWT_SECRET:?Supply a fresh test-only secret}
      CORS_ORIGIN: http://127.0.0.1:${ACCEPTANCE_PORT:?Supply an unused loopback port}
      APP_ORIGIN: http://127.0.0.1:${ACCEPTANCE_PORT}
    labels:
      io.lumina.acceptance: "true"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 3s
      timeout: 5s
      retries: 30
  frontend:
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
    ports:
      - "127.0.0.1:${ACCEPTANCE_PORT}:80"
    labels:
      io.lumina.acceptance: "true"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
  uploads_data:
