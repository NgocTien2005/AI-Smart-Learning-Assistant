# Never include request URLs, arguments, headers or identity in diagnostics.
log_format lumina_safe escape=json '{"status":$status,"bytes":$body_bytes_sent,"seconds":$request_time}';
# Native error records can contain the complete request, with no format control.
# See docs/operations.md for the diagnostic tradeoff and incident procedure.
error_log /dev/null;

server {
  listen 80;
  server_name _;
  client_max_body_size 12m;
  server_tokens off;
  access_log /dev/stdout lumina_safe;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header Referrer-Policy;
    proxy_pass http://backend:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
